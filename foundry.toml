[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = ".tools/solc"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/", "forge-std/=lib/forge-std/src/"]
fuzz.runs = 10000
invariant.runs = 100
invariant.depth = 64
invariant.fail_on_revert = true

[profile.ci.invariant]
runs = 10000
depth = 64
fail_on_revert = true
